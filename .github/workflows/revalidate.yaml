name: Revalidate Portfolio

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/generate-manifest.js"
      - "notes-manifest.json"
      - ".github/workflows/revalidate.yaml"

jobs:
  revalidate:
    runs-on: ubuntu-latest
    environment: env
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff the push that triggered this run — before any auto-commit of the
      # manifest, which would otherwise make HEAD~1..HEAD look like a
      # manifest-only change and leave addedModified empty.
      - name: Get changed files
        id: changed
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            ADDED_MODIFIED=$(git ls-files '*.md' | jq -R -s -c 'split("\n")[:-1]')
            DELETED="[]"
          else
            ADDED_MODIFIED=$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- '*.md' | jq -R -s -c 'split("\n")[:-1]')
            DELETED=$(git diff --name-only --diff-filter=D "$BEFORE_SHA" "$AFTER_SHA" -- '*.md' | jq -R -s -c 'split("\n")[:-1]')
          fi
          # Always include the manifest so /notes index revalidates
          ADDED_MODIFIED=$(echo "$ADDED_MODIFIED" | jq -c '. + ["notes-manifest.json"] | unique')
          echo "added_modified=$ADDED_MODIFIED" >> $GITHUB_OUTPUT
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT

      - name: Generate Notes Manifest
        run: node scripts/generate-manifest.js

      - name: Commit and Push Manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add notes-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate notes-manifest.json [skip ci]"
            git push origin main
          else
            echo "No changes in notes-manifest.json"
          fi

      - name: Call revalidation webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "secret": "${{ secrets.REVALIDATE_SECRET_TOKEN }}",
              "addedModified": ${{ steps.changed.outputs.added_modified }},
              "deleted": ${{ steps.changed.outputs.deleted }}
            }' \
            ${{ secrets.PORTFOLIO_WEBHOOK_URL }}
