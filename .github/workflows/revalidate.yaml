name: Revalidate Portfolio

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.[pP][nN][gG]"
      - "**/*.[jJ][pP][gG]"
      - "**/*.[jJ][pP][eE][gG]"
      - "**/*.[wW][eE][bB][pP]"
      - "**/*.[gG][iI][fF]"
      - "**/*.[sS][vV][gG]"
      - "**/*.[aA][vV][iI][fF]"
      - "**/*.[bB][mM][pP]"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "notes-manifest.json"
      - "notes-media-manifest.json"
      - ".github/workflows/revalidate.yaml"
  workflow_dispatch:

concurrency:
  group: notes-publishing-main
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: env
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject superseded source revisions
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || {
            echo "Source changed before publishing. Run the workflow on the latest main revision."
            exit 1
          }

      - name: Capture source changes before generated commits
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            ADDED_MODIFIED=$(git ls-files '*.md' | jq -R -s -c 'split("\n")[:-1]')
            DELETED='[]'
          else
            ADDED_MODIFIED=$(git diff --name-only --diff-filter=AMR "$BEFORE_SHA" "$GITHUB_SHA" | jq -R -s -c 'split("\n")[:-1]')
            DELETED=$(git diff --name-only --diff-filter=D "$BEFORE_SHA" "$GITHUB_SHA" | jq -R -s -c 'split("\n")[:-1]')
          fi
          ADDED_MODIFIED=$(echo "$ADDED_MODIFIED" | jq -c '. + ["notes-manifest.json", "notes-media-manifest.json"] | unique')
          echo "added_modified=$ADDED_MODIFIED" >> "$GITHUB_OUTPUT"
          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked publishing dependencies
        run: bun install --frozen-lockfile

      - name: Publish referenced media
        id: media
        env:
          SOURCE_REVISION: ${{ github.sha }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NOTES_BLOB_HOST: ${{ vars.NOTES_BLOB_HOST }}
          NOTES_MEDIA_MODE: ${{ vars.NOTES_MEDIA_MODE }}
        run: |
          case "$NOTES_MEDIA_MODE" in
            blob) node scripts/publish-media.mjs ;;
            github-only) node scripts/publish-media.mjs --github-only ;;
            *) echo 'Set NOTES_MEDIA_MODE to blob or explicitly to github-only in environment env.'; exit 1 ;;
          esac

      - name: Generate notes manifest
        run: node scripts/generate-manifest.js

      - name: Commit completed metadata without rebasing stale mappings
        id: committed
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || {
            echo 'Source changed during generation. Refusing stale metadata and webhook. The next run must regenerate.'
            exit 1
          }
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add notes-manifest.json notes-media-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish completed notes and media metadata [skip ci]'
            # A normal push rejects a concurrent source change. Never rebase generated JSON.
            git push origin HEAD:main
          fi
          echo "published_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate only after metadata is readable
        env:
          REVALIDATE_SECRET_TOKEN: ${{ secrets.REVALIDATE_SECRET_TOKEN }}
          PORTFOLIO_WEBHOOK_URL: ${{ secrets.PORTFOLIO_WEBHOOK_URL }}
          ADDED_MODIFIED: ${{ steps.changed.outputs.added_modified }}
          DELETED: ${{ steps.changed.outputs.deleted }}
          AFFECTED_SLUGS: ${{ steps.media.outputs.affected_slugs }}
          PUBLISHED_REVISION: ${{ steps.committed.outputs.published_revision }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PUBLISHED_REVISION" || {
            echo 'Source advanced after metadata commit. Refusing out-of-order revalidation.'; exit 1
          }
          jq -n '{secret: env.REVALIDATE_SECRET_TOKEN, addedModified: (env.ADDED_MODIFIED | fromjson), deleted: (env.DELETED | fromjson), affectedSlugs: (env.AFFECTED_SLUGS | fromjson), publishedRevision: env.PUBLISHED_REVISION}' > "$RUNNER_TEMP/revalidate.json"
          trap 'rm -f "$RUNNER_TEMP/revalidate.json"' EXIT
          # GitHub raw main can retain its previous response for several minutes.
          # Keep the freshness gate and allow it to converge before failing publication.
          for attempt in $(seq 1 16); do
            STATUS=$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
              -o "$RUNNER_TEMP/revalidate-response.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/revalidate.json" "$PORTFOLIO_WEBHOOK_URL") || STATUS=000
            if [ "$STATUS" = 200 ]; then cat "$RUNNER_TEMP/revalidate-response.json"; exit 0; fi
            if [ "$STATUS" != 409 ] && [ "$STATUS" != 503 ] && [ "$STATUS" != 000 ]; then
              cat "$RUNNER_TEMP/revalidate-response.json"; exit 1
            fi
            if [ "$attempt" -lt 16 ]; then sleep 20; fi
          done
          echo "Revalidation failed after bounded retries: HTTP $STATUS"; exit 1
